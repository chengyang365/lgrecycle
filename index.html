    // 0. Service Worker: 无网秒开
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            try {
                const swCode = `
                    const CACHE_NAME = 'sjkc-recycle-v2';
                    self.addEventListener('install', e => { 
                        e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll([
                            window.location.href,
                            'https://unpkg.com/react@18/umd/react.development.js',
                            'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
                            'https://unpkg.com/@babel/standalone/babel.min.js',

                            'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
                        ]))); 
                    });
                    self.addEventListener('fetch', e => {
                        if(e.request.url.includes('script.google.com')) return;
                        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request).then(fRes => {
                            if(fRes && fRes.status === 200 && fRes.type === 'basic') {
                                const resClone = fRes.clone();
                                caches.open(CACHE_NAME).then(c => c.put(e.request, resClone));
                            }
                            return fRes;
                        })));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW Blob restricted.', err));
            } catch (e) {}
        });
    }

    // 1. Web Crypto API: 生成 SHA-256 完整性校验哈希
    const generateChecksum = async (payloadObj) => {
        if (!payloadObj) return "";
        try {
            const msgUint8 = new TextEncoder().encode(JSON.stringify(payloadObj));
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
            return "hash_generation_failed";
        }
    };

    class ErrorBoundary extends Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(error) { return { hasError: true, error }; }
        componentDidCatch(error, errorInfo) { console.error("Caught by ErrorBoundary:", error, errorInfo); }
        handleReset = () => { if(confirm("确定要重置所有本地数据吗？")) { localStorage.clear(); window.location.reload(); } }
        render() {
            if (this.state.hasError) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-red-50 p-6 text-center">
                    <h1 className="text-2xl font-bold text-red-600 mb-2">系统发生错误 (Ralat Sistem)</h1>
                    <p className="text-slate-600 mb-6">因浏览器限制或冲突导致，请尝试刷新。</p>
                    <div className="flex gap-4">

                        <button onClick={this.handleReset} className="bg-red-600 text-white px-6 py-2 rounded-lg font-bold">重置</button>
                    </div>
                    <pre className="text-left text-xs bg-gray-100 p-4 mt-8 overflow-auto max-w-full rounded-xl">{this.state.error?.toString()}</pre>
                </div>
            );
            return this.props.children;
        }
    }

    const playSound = (type) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (type === 'success') { osc.type = 'sine'; osc.frequency.setValueAtTime(500, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); } 
            else { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); }
        } catch (e) { }

        const executeSync = useCallback(async (isSilent = false) => {

            let successCount = 0; 
            const remainingQueue = [...queueToSync];

            for (let i = 0; i < remainingQueue.length; i++) {
                const req = remainingQueue[i];
                if ((req.retryCount || 0) >= 3) { hasError = true; continue; } 
                
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); 
                    
                    const res = await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                        body: JSON.stringify(req),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (!res.ok) throw new Error("HTTP Status Error: " + res.status);
                    const resData = await res.json();
                    
                    if (resData && (resData.status === 'success' || resData.status === true)) {
                        req.success = true;
                        successCount++;
                    } else {
                        throw new Error(resData.message || "Google Sheet Rejected Data");
                    }

                } catch(e) { 
                    console.warn(`Sync Failed for UUID: ${req.uuid}`, e);

            const newQueue = remainingQueue.filter(req => !req.success);

            safeSetStorage('sjkc_unsynced_queue', JSON.stringify(newQueue));
            
            if (!isSilent) setLoading(false);
            if (successCount > 0 && !isSilent) { showNotification(`成功同步 ${successCount} 项操作`, "success"); }
            if (hasError) {

                if(!isSilent) showNotification(`部分数据写入失败或网络异常`, "error");

            const task = { action, data, uuid, checksum, retryCount: 0 };
            
            setUnsyncedQueue(prev => {

        // 自动心跳补传机制 (Heartbeat Auto-Sync)

        // Emergency CSV Export

             unsyncedQueue.forEach(q => {
                 csvContent += `${q.action},${q.uuid},${JSON.stringify(q.data).replace(/,/g, ';')},${q.checksum},${q.retryCount}\n`;
             });
             const link = document.createElement("a");
             link.setAttribute("href", encodeURI(csvContent));

             document.body.appendChild(link); link.click(); document.body.removeChild(link);

        useEffect(() => { safeSetStorage('sjkc_entries', JSON.stringify(entries)); }, [entries]);

        const fetchEntries = useCallback(async () => {

                // 将本地未同步数据与云端数据无缝合并，确保页面刷新数据不消失

        const fetchStudents = useCallback(async () => {

        useEffect(() => { if (isCloudEnabled && !cloudError) { fetchEntries(); fetchStudents(); fetchSettings(); } else { setLoading(false); } }, [fetchEntries, fetchStudents, fetchSettings, isCloudEnabled, cloudError]);

        const normalizedEntries = useMemo(() => {

                        if (updated) return newEntry;

                return entry;

        const filteredEntries = useMemo(() => {
            if (!normalizedEntries || !Array.isArray(normalizedEntries)) return [];
            return normalizedEntries.filter(entry => {

        }, [normalizedEntries, filterYear, filterMonthStart, filterMonthEnd]);

        const stats = useMemo(() => {

                let grade = parseInt(entry.year); if (isNaN(grade) || grade === 0) grade = entry.className ? parseInt(entry.className.charAt(0)) : 0; if (isNaN(grade)) grade = 0;
                if (!classTotals[entry.className]) classTotals[entry.className] = { className: entry.className, totalWeight: 0, grade: grade, totalDeduction: 0, monthlyWeights: {} };
                classTotals[entry.className].totalWeight += w;
                if (entry.type === 'deduction') classTotals[entry.className].totalDeduction += Math.abs(w);
                const monthKey = entry.month || 'Unknown';
                if (!classTotals[entry.className].monthlyWeights[monthKey]) classTotals[entry.className].monthlyWeights[monthKey] = 0;
                classTotals[entry.className].monthlyWeights[monthKey] += w;
                
                // 个人聚合与全勤记录
                if (entry.type === 'recycle' && (entry.name || entry.studentID)) {
                    let uniqueKey = entry.studentID ? `ID-${entry.studentID}` : `NAME-${entry.className}-${entry.name}`;
                    let displayName = entry.name || (entry.studentID ? `ID: ${entry.studentID}` : 'Unknown');
                    if (!individualTotals[uniqueKey]) { 
                        individualTotals[uniqueKey] = { name: displayName, studentID: entry.studentID, className: entry.className, totalWeight: 0, grade: grade, activeMonthsSet: new Set() }; 
                    } else if (entry.name && individualTotals[uniqueKey].name.startsWith('ID:')) { 
                        individualTotals[uniqueKey].name = entry.name; 
                    }
                    individualTotals[uniqueKey].totalWeight += w;
                    // 记录学生参与的独立月份
                    individualTotals[uniqueKey].activeMonthsSet.add(entry.calendarYear + '-' + monthKey); 
                    individualTotals[uniqueKey].badge = getGamificationBadge(individualTotals[uniqueKey].totalWeight);
                }
            });
            Object.values(classTotals).forEach(c => { let reward = 0; Object.values(c.monthlyWeights).forEach(monthWeight => { if (monthWeight >= 50) reward += Math.floor(monthWeight / 50) * 10; }); c.totalReward = reward; });
            const sortedClasses = Object.values(classTotals).sort((a, b) => b.totalWeight - a.totalWeight); 
            const sortedIndividuals = Object.values(individualTotals).map(i => {
                i.activeMonths = i.activeMonthsSet.size; // 提取总活跃月数
                return i;
            }).sort((a, b) => b.totalWeight - a.totalWeight);
            
            return { grandTotal, classLower: sortedClasses.filter(c => c.grade >= 1 && c.grade <= 3), classUpper: sortedClasses.filter(c => c.grade >= 4 && c.grade <= 6), indivLower: sortedIndividuals.filter(i => i.grade >= 1 && i.grade <= 3), indivUpper: sortedIndividuals.filter(i => i.grade >= 4 && i.grade <= 6) };

            if (!importClass) return showNotification("请选择班级", "error"); if (!importText.trim()) return showNotification("请输入学生数据", "error");

        };

                lines.forEach((line, index) => { if (index === 0 || !line.trim()) return; const parts = line.split(',').map(p => p.trim()); if (parts.length >= 3) newStudents.push({ className: parts[0], id: parts[1], name: parts[2], createdAt: timestamp + index }); });

                if(smartImportRef.current) smartImportRef.current.value = '';
            }; reader.readAsText(file);
        };

        const handleUpdateStudent = async (e) => { e.preventDefault(); setStudents(prev => prev.map(s => s.id === editingStudent.id ? editingStudent : s)); setEditingStudent(null); showNotification("已更新", "success"); await safeSendToSheet('updateStudent', editingStudent); };

        const handleBackupData = () => { const bData = { entries, students, timestamp: new Date().toISOString() }; const blob = new Blob([JSON.stringify(bData, null, 2)], { type: "application/json" }); const l = document.createElement('a'); l.download = `SJKCLG_Backup_${new Date().toISOString().slice(0,10)}.json`; l.href = URL.createObjectURL(blob); l.click(); showNotification("备份已下载", "success"); };
        const handleRestoreData = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (event) => { try { const data = JSON.parse(event.target.result); if (data.entries && data.students) { setEntries(data.entries); setStudents(data.students); showNotification("恢复成功，建议刷新页面", "success"); } else { showNotification("无效文件", "error"); } } catch (err) { showNotification("解析失败", "error"); } if (fileInputRef.current) fileInputRef.current.value = ''; }; reader.readAsText(file); };
        const handleClearAll = () => { if (confirm("警告：清空所有数据？")) { requestSecureAction(async () => { setEntries([]); setStudents([]); setPendingDeletions([]); localStorage.clear(); showNotification("已重置", "success"); await safeSendToSheet('clearAllData'); }); } };

                                <h3 className="text-xl font-bold text-slate-800 mb-2">请求删除 / Mohon Padam</h3>
                                <p className="text-sm text-slate-500 mb-4">请输入删除原因 / Masukkan sebab:</p>
                                <input type="text" value={deleteRequestModal.reason} onChange={(e) => setDeleteRequestModal({...deleteRequestModal, reason: e.target.value})} placeholder="Example: Wrong weight" className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" />
                                <div className="flex justify-end gap-3 mt-4">
                                    <button onClick={() => setDeleteRequestModal({ show: false, id: null, reason: '' })} className="px-4 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-100">取消 / Batal</button>
                                    <button onClick={confirmRequestDelete} className="px-4 py-2 rounded-lg font-bold text-white shadow-lg bg-orange-600 hover:bg-orange-700">提交申请 / Mohon</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingStudent && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 animate-pop">
                                <h3 className="text-xl font-bold mb-4 text-slate-800">编辑学生 / Kemaskini</h3>
                                <form onSubmit={handleUpdateStudent} className="space-y-4">
                                    <div><label className="text-xs font-bold text-slate-500">ID (不可更改)</label><input type="text" value={editingStudent.id} disabled className="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 font-mono" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">姓名 / Nama</label><input type="text" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} className="w-full p-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required /></div>
                                    <div><label className="text-xs font-bold text-slate-500">班级 / Kelas</label><select value={editingStudent.className} onChange={e => setEditingStudent({...editingStudent, className: e.target.value})} className="w-full p-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>{CLASS_OPTIONS.map(cls => <option key={cls} value={cls}>{cls}</option>)}</select></div>
                                    <div className="flex gap-2 pt-2"><button type="button" onClick={() => setEditingStudent(null)} className="flex-1 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-100">取消 / Batal</button><button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold shadow-md">保存 / Simpan</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </ErrorBoundary>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
