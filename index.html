    const safeSetStorage = (key, value) => { try { localStorage.setItem(key, value); } catch (e) { console.warn("Local storage disabled"); } };
    const csvCell = (value) => {
        let text = String(value ?? '');
        if (/^[=+\-@]/.test(text)) text = `'${text}`;
        return `"${text.replace(/"/g, '""')}"`;
    };
    const csvRow = (values) => values.map(csvCell).join(',') + '\n';
    const parseCsv = (text) => {
        const rows = []; let row = []; let field = ''; let quoted = false;
        for (let i = 0; i < text.length; i++) {
            const ch = text[i], next = text[i + 1];
            if (ch === '"' && quoted && next === '"') { field += '"'; i++; }
            else if (ch === '"') quoted = !quoted;
            else if (ch === ',' && !quoted) { row.push(field.trim()); field = ''; }
            else if ((ch === '\n' || ch === '\r') && !quoted) { if (ch === '\r' && next === '\n') i++; row.push(field.trim()); if (row.some(Boolean)) rows.push(row); row = []; field = ''; }
            else field += ch;
        }
        row.push(field.trim()); if (row.some(Boolean)) rows.push(row);
        return rows;
    };

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed', err)));
    }

    const generateChecksum = async (payloadObj) => {
        if (!payloadObj) return "";
        try {
            const msgUint8 = new TextEncoder().encode(JSON.stringify(payloadObj));
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) { return "hash_generation_failed"; }
    };

    class ErrorBoundary extends Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(error) { return { hasError: true, error }; }
        componentDidCatch(error, errorInfo) { console.error("Caught by ErrorBoundary:", error, errorInfo); }
        handleReset = () => { if(confirm("确定要重置所有本地数据吗？")) { localStorage.clear(); window.location.reload(); } }

                    <pre className="text-left text-xs bg-gray-100 p-4 mt-8 overflow-auto max-w-full rounded-xl">{this.state.error?.toString()}</pre>

            );

        }

    const playSound = (type) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (type === 'success') { osc.type = 'sine'; osc.frequency.setValueAtTime(500, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }

            const focusable = dialog => Array.from(dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'));
            const updateFocus = () => {
                const dialog = getDialog();
                if (!dialog) {
                    if (dialogWasOpen && modalFocusRef.current?.isConnected) modalFocusRef.current.focus();
                    dialogWasOpen = false;
                    return;
                }
                if (!dialogWasOpen) modalFocusRef.current = document.activeElement;
                dialogWasOpen = true;
                if (!dialog.contains(document.activeElement)) focusable(dialog)[0]?.focus();
            };
            const onKeyDown = event => {
                if (event.key !== 'Tab') return;
                const dialog = getDialog(); if (!dialog) return;
                const items = focusable(dialog); if (!items.length) { event.preventDefault(); return; }
                const first = items[0], last = items[items.length - 1];
                if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
                else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
            };
            const observer = new MutationObserver(updateFocus);
            observer.observe(document.body, { childList: true, subtree: true });

            if (queueToSync.length === 0) return;

            isSyncingRef.current = true;
            if (!isSilent) setLoading(true);

            let successCount = 0;
            const remainingQueue = [...queueToSync];
            let hasError = false;

            for (let i = 0; i < remainingQueue.length; i++) {
                const req = remainingQueue[i];
                if ((req.retryCount || 0) >= 3 && !retryFailed) { hasError = true; continue; }

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(req),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    if (!res.ok) throw new Error("HTTP Status Error: " + res.status);
                    const resData = await res.json();

                    if (resData && (resData.status === 'success' || resData.status === true)) {
                        req.success = true;
                        successCount++;
                    } else {
                        throw new Error(resData.message || "Google Sheet Rejected Data");
                    }
                } catch(e) {
                    console.warn(`Sync Failed for UUID: ${req.uuid}`, e);
                    req.retryCount = (req.retryCount || 0) + 1;

                    if (e.name === 'AbortError' || e.message.includes('Timeout')) setNeedsReconciliation(true);
                }
            }

            setUnsyncedQueue(prevQueue => {

                const newQueue = prevQueue.filter(q => !syncedUuids.includes(q.uuid));
                safeSetStorage('sjkc_unsynced_queue', JSON.stringify(newQueue));
                return newQueue;
            });

            if (successCount > 0) {
                setCloudStatus(prev => ({ ...prev, lastSuccessAt: new Date().toISOString() }));
                setNeedsReconciliation(true);
            }
            if (!isSilent) setLoading(false);
            if (successCount > 0 && !isSilent) showNotification(`成功同步 ${successCount} 项操作`, "success");

                setCloudError(true);

                    return;

                setStudents(Array.from(new Map(cloudStudents.map(item => [item.id, item])).values()));

                let currentQueue = JSON.parse(localStorage.getItem('sjkc_unsynced_queue') || '[]');
                const reconciledQueue = currentQueue.filter(q => {
                    if (q.action === 'addEntry') return !cloudIds.has(q.data.id);
                    if (q.action === 'addEntriesBatch' && Array.isArray(q.data)) {
                        if (q.data.length > 0 && q.data.every(item => cloudIds.has(item.id))) return false;
                        return true;
                    }
                    if (q.action === 'deleteEntry') return cloudIds.has(q.data.id);
                    return true;
                });

                if (reconciledQueue.length !== currentQueue.length) {
                    setUnsyncedQueue(prevQueue => {
                        const latestReconciled = prevQueue.filter(q => {
                            if (q.action === 'addEntry') return !cloudIds.has(q.data.id);
                            if (q.action === 'addEntriesBatch' && Array.isArray(q.data)) return !(q.data.length > 0 && q.data.every(item => cloudIds.has(item.id)));
                            if (q.action === 'deleteEntry') return cloudIds.has(q.data.id);
                            return true;
                        });
                        safeSetStorage('sjkc_unsynced_queue', JSON.stringify(latestReconciled));
                        return latestReconciled;
                    });
                }

                const pendingDeletes = reconciledQueue.filter(q => q.action === 'deleteEntry').map(q => q.data.id);
                const localUnsynced = reconciledQueue.flatMap(q => {
                    if (q.action === 'addEntry') return [q.data];
                    if (q.action === 'addEntriesBatch') return q.data;
                    return [];

                const combined = [...localUnsynced, ...cloudData];
                const uniqueEntries = Array.from(new Map(combined.map(item => [item.id, item])).values());

        const handleLogin = async (e) => {

        const handleInputChange = (e) => {
            const { name, value } = e.target;

                const val = value.replace(/[^0-9]/g, '');

            } else if (name === 'studentName') {
                const match = students.find(s => s.name.toLowerCase() === value.toLowerCase().trim());
                if(match) { setFormData(prev => ({...prev, [name]: value, studentID: match.id, selectedClass: match.className || prev.selectedClass})); setStudentFound(true); } else { setFormData(prev => ({ ...prev, [name]: value })); }
            } else { setFormData(prev => ({ ...prev, [name]: value })); }
        };

        const clearID = () => { setFormData(prev => ({ ...prev, studentID: '', ...(studentFound ? {studentName: ''} : {}) })); setStudentFound(false); if(studentIdRef.current) studentIdRef.current.focus(); };
        const clearName = () => { setFormData(prev => ({ ...prev, studentName: '', ...(studentFound ? {studentID: ''} : {}) })); setStudentFound(false); };
        const handleResetID = () => { setFormData(prev => ({ ...prev, studentID: '', studentName: '', weight: '' })); setStudentFound(false); setWeightRows(['']); if(studentIdRef.current) studentIdRef.current.focus(); };
        const toggleSelectAll = (e) => { if (e.target.checked) setSelectedStudentIds(new Set(filteredStudents.map(s => s.id))); else setSelectedStudentIds(new Set()); };
        const toggleSelectOne = (id) => { const newSet = new Set(selectedStudentIds); if (newSet.has(id)) newSet.delete(id); else newSet.add(id); setSelectedStudentIds(newSet); };

        const handleWeightRowChange = (index, value) => {
            let val = value.replace(/[^0-9.]/g, ''); const parts = val.split('.'); if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
            if (/^(\d+(\.\d{0,2})?)?$/.test(val) || val === '') { const newRows = [...weightRows]; newRows[index] = val; setWeightRows(newRows); }
        };

        const addWeightRow = () => setWeightRows([...weightRows, '']);
        const removeWeightRow = (index) => { if (weightRows.length > 1) setWeightRows(weightRows.filter((_, i) => i !== index)); };
        const clearWeightRow = (index) => { const newRows = [...weightRows]; newRows[index] = ''; setWeightRows(newRows); };
        const calculateTotalWeight = () => weightRows.reduce((acc, curr) => acc + (parseFloat(curr) || 0), 0);

        const handleBatchClassChange = (e) => { const cls = e.target.value; if (Object.keys(batchInputs).length > 0) { if(!confirm("切换班级将清空未提交草稿，继续吗？")) return; } setBatchClass(cls); setBatchInputs({}); };
        const handleBatchInputChange = (studentId, weight) => { let val = weight.replace(/[^0-9.]/g, ''); const parts = val.split('.'); let fVal = parts[0]; if (parts.length > 1) fVal += '.' + parts.slice(1).join('').slice(0, 2); setBatchInputs(prev => ({...prev, [studentId]: fVal})); };

        const handleBatchSubmit = async () => {
            if (!formData.teacherName.trim()) { playSound('error'); return showNotification("请填写老师姓名", "error"); }
            const entriesToAdd = []; const timestamp = Date.now(); const entryDateObj = new Date(formData.entryDate); const currentMonthStr = MONTH_OPTIONS[entryDateObj.getMonth()]; const currentYearInt = entryDateObj.getFullYear(); const displayTime = new Date().toLocaleTimeString('zh-MY', {hour: '2-digit', minute:'2-digit'}); const studentGrade = batchClass ? (parseInt(batchClass.charAt(0)) || 0) : 0;
            const createdAtStr = generateTimestampStr(formData.entryDate);
            Object.keys(batchInputs).forEach(studentId => {
                const weightVal = parseFloat(batchInputs[studentId]);
                if (weightVal > 0) {
                    const student = students.find(s => s.id === studentId);
                    entriesToAdd.push({ id: crypto.randomUUID(), type: 'recycle', teacherName: formData.teacherName.trim() || 'Batch', name: student ? student.name : 'Unknown', studentID: studentId, className: batchClass, weight: weightVal, month: currentMonthStr, calendarYear: currentYearInt, year: studentGrade, createdAt: createdAtStr, displayTime: displayTime });
                }

            if (entriesToAdd.length === 0) return showNotification("请输入至少一个重量", "error");
            setEntries(prev => [...entriesToAdd, ...prev]); 
            setBatchInputs({}); 
            showNotification(`成功添加 ${entriesToAdd.length} 条记录 (已进队列)`, "success");
            
            await safeSendToSheet('addEntriesBatch', entriesToAdd);
        };

        const handlePenaltyInputChange = (reason, value) => { setPenaltyInputs(prev => ({ ...prev, [reason]: value.replace(/[^0-9]/g, '') })); };

        const handlePenaltyBatchSubmit = async () => {
            if (!penaltyTeacher.trim()) { playSound('error'); return showNotification("请填写老师姓名", "error"); }

            const hasData = Object.values(penaltyInputs).some(val => parseFloat(val) > 0); if (!hasData) return showNotification("请输入至少一项数值", "error");
            const studentGrade = parseInt(penaltyClass.charAt(0)) || 0; const currentMonthStr = MONTH_OPTIONS[penaltyMonthIndex]; const currentYearInt = penaltyYear; const timestamp = Date.now(); const displayTime = new Date().toLocaleTimeString('zh-MY', {hour: '2-digit', minute:'2-digit'}); const createdAtStr = generateTimestampStr();
            const entriesToAdd = [];
            Object.entries(penaltyInputs).forEach(([reason, value]) => {
                const val = parseInt(value, 10);
                if (val > 0) entriesToAdd.push({ id: crypto.randomUUID(), type: 'deduction', teacherName: penaltyTeacher.trim(), name: '', studentID: '', className: penaltyClass, reason: reason, weight: -Math.abs(val), month: currentMonthStr, calendarYear: currentYearInt, year: studentGrade, createdAt: createdAtStr, displayTime: displayTime });
            });
            setEntries(prev => [...entriesToAdd, ...prev]); 
            setPenaltyInputs({ 'Food Waste': '', 'Electricity': '', 'Others': '' }); 
            showNotification("扣分记录已提交", "success");
            
            await safeSendToSheet('addEntriesBatch', entriesToAdd);
        };

        const handleSubmit = async (e) => {
            e.preventDefault(); if (!formData.teacherName) { playSound('error'); return showNotification("请填写老师姓名", "error"); }

            let finalClass = formData.selectedClass; if (formData.studentID) { const matchedStudent = students.find(s => s.id === formData.studentID); if (matchedStudent && matchedStudent.className) finalClass = matchedStudent.className; }
            const entryDateObj = new Date(formData.entryDate); const studentGrade = finalClass ? (parseInt(finalClass.charAt(0)) || 0) : 0; const timestamp = Date.now(); const displayTime = new Date().toLocaleTimeString('zh-MY', {hour: '2-digit', minute:'2-digit'}); const createdAtStr = generateTimestampStr(formData.entryDate);
            const newEntry = { id: crypto.randomUUID(), type: 'recycle', teacherName: formData.teacherName.trim(), name: formData.studentName.trim(), studentID: formData.studentID.trim(), className: finalClass, weight: parseFloat(calculatedTotal.toFixed(2)), month: MONTH_OPTIONS[entryDateObj.getMonth()], calendarYear: entryDateObj.getFullYear(), year: studentGrade, createdAt: createdAtStr, displayTime: displayTime };

        const handleRequestDelete = (id) => setDeleteRequestModal({ show: true, id: id, reason: '' });

                setConfirmModal(prev => ({ ...prev, show: false })); setEntries([]); setPendingDeletions([]); showNotification("记录已清空", "success"); safeSendToSheet('clearAllEntries');
            }});
        };

        const handleBatchDelete = () => {
            if (selectedStudentIds.size === 0) return;
            setConfirmModal({ show: true, title: "批量删除", msg: `确定删除 ${selectedStudentIds.size} 名学生？`, isDestructive: true, onConfirm: () => {

            e.preventDefault(); if (!singleStudent.id.trim() || !singleStudent.name.trim() || !singleStudent.className) return showNotification("请填写完整信息", "error"); if (students.some(s => s.id === singleStudent.id.trim())) return showNotification("该学号已存在", "error");
            const newObj = { id: singleStudent.id.trim(), name: singleStudent.name.trim(), className: singleStudent.className, createdAt: Date.now() }; setStudents(prev => [newObj, ...prev]); 
            setSingleStudent({ id: '', name: '', className: '' }); showNotification(`已添加学生: ${newObj.name}`, "success");
            await safeSendToSheet('addStudentsBatch', [newObj]);

        const handleRecycleUnlock = async () => {

            setRecycleSecurityInput('');
        };

        const handleDashboardUnlock = async () => {
            try {
                const result = await requestServerAuth('verifySecurity', { password: dashboardSecurityInput });
                if (result.status !== 'success') throw new Error('Invalid password');
                setDashboardActionsUnlocked(true); setShowDashboardUnlockModal(false);
                if (pendingDashboardAction) pendingDashboardAction();
                setPendingDashboardAction(null); playSound('success'); showNotification('解锁成功', 'success');
            } catch (error) { playSound('error'); showNotification('密码错误或认证服务不可用', 'error'); }
            setDashboardSecurityInput('');
        };

        const requestSecureAction = (cb) => { setSecurityCheck({ show: true, callback: cb, error: '', verifying: false }); setSecurityInput(''); };
        
        const handleSecurityVerify = async (e) => {
            if (e && e.preventDefault) e.preventDefault();

                const result = await requestServerAuth('verifySecurity', { password: securityInput });
                if (result.status !== 'success') throw new Error('Invalid password');
                if (securityCheck.callback) {
                    securityCheck.callback();
                    setSecurityCheck({ show: false, callback: null, error: '', verifying: false });

            }
            setSecurityInput('');
        };

        const handleImportStudents = async () => {
            if (!importClass) return showNotification("请选择班级", "error"); if (!importText.trim()) return showNotification("请输入学生数据", "error");
            const lines = importText.split('\n'); const newStudents = []; const timestamp = Date.now();
            lines.forEach((line, index) => { if (!line.trim()) return; const parts = line.split(','); if (parts.length >= 2) newStudents.push({ id: parts[0].trim(), name: parts[1].trim(), className: importClass, createdAt: timestamp + index }); });

                if(smartImportRef.current) smartImportRef.current.value = '';
            }; reader.readAsText(file);
        };

        const handleBackupData = () => { const bData = { entries, students, timestamp: new Date().toISOString() }; const blob = new Blob([JSON.stringify(bData, null, 2)], { type: "application/json" }); const l = document.createElement('a'); l.download = `SJKCLG_Backup_${new Date().toISOString().slice(0,10)}.json`; l.href = URL.createObjectURL(blob); l.click(); showNotification("备份已下载", "success"); };

        const handleClearAll = () => { requestSecureAction(() => { if (confirm("警告：清空所有数据？")) { setEntries([]); setStudents([]); setPendingDeletions([]); localStorage.clear(); showNotification("已重置", "success"); safeSendToSheet('clearAllData'); } }); };

        return (

                                <div className="flex flex-col"><h1 className="text-sm md:text-xl font-bold tracking-tight whitespace-nowrap">新廊华小校园环保回收计划</h1><span className="text-[10px] md:text-xs font-normal text-emerald-100">Projek Kitar Semula SJK (C) Ladang Grisek</span></div>

                                        {unsyncedQueue.some(q => (q.retryCount||0) >= 3) && <button onClick={handleEmergencyExport} className="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold shadow-md animate-bounce border border-red-400">🚨 应急导出</button>}
                                    </div>

                                            <button onClick={handleGoToDashboard} className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'dashboard' ? 'bg-white text-emerald-700' : 'bg-emerald-800/50 text-emerald-100 hover:bg-emerald-800'}`}><div className="flex items-center gap-1"><IconBarChart size={16}/> <span className="hidden md:inline">仪表板 (Dashboard)</span></div></button>

                                            <button onClick={handleLogout} className="bg-red-500/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold transition-all ml-2" title="退出 / Log Keluar"><IconUnlock size={16}/></button>

                                                            <div className="h-full flex flex-col items-center justify-center text-slate-300 gap-2 text-center px-4"><IconInbox size={32} /><BilingualLabel primary="该班级暂无回收记录" secondary="Tiada rekod kitar semula untuk kelas ini" className="text-sm font-bold text-slate-600" /><button type="button" onClick={resetDashboardFilters} className="mt-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs font-bold text-emerald-800 hover:bg-emerald-100">重置筛选 / Tetapkan Semula</button></div>
                                                        ) : (
                                                            <ul>{classStats.map((item, index) => ( <RankItem key={index} item={item} index={index} maxValue={classStats[0].totalWeight} type="student_no_class" isAdmin={authRole !== 'guest'} /> ))}</ul>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {authRole === 'admin' && (
                                            <div className="flex justify-center flex-wrap gap-4 pt-8 pb-4">
                                                <button disabled={loading} id="poster-btn" onClick={() => executeDashboardAction(handleGenerateClassPoster)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2 transition-transform active:scale-95 disabled:bg-slate-400">
                                                    <IconImage size={18} /> 生成班级月报 / Laporan Kelas
                                                </button>
                                                <button disabled={loading} id="poster-indiv-btn-lower" onClick={() => executeDashboardAction(() => handleGenerateIndivPoster('lower'))} className="bg-amber-500 hover:bg-amber-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2 transition-transform active:scale-95 disabled:bg-slate-400">
                                                    <IconCrown size={18} /> 王者榜 (低年级)
                                                </button>
                                                <button disabled={loading} id="poster-indiv-btn-upper" onClick={() => executeDashboardAction(() => handleGenerateIndivPoster('upper'))} className="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2 transition-transform active:scale-95 disabled:bg-slate-400">
                                                    <IconCrown size={18} /> 王者榜 (高年级)
                                                </button>
                                                <button disabled={loading} id="export-img-btn" onClick={() => executeDashboardAction(handleExportImage)} className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2 transition-transform active:scale-95 disabled:bg-slate-400">
                                                    <IconCamera size={18} /> 📸 保存当前报表 / Simpan Gambar
                                                </button>
                                            </div>
                                        )}
                                    </React.Fragment>
                                )}
                            </div>
                        )}
                    </main>

                    <footer className="no-print mt-10 border-t border-emerald-100 bg-white/70">
                        <div className="max-w-7xl mx-auto px-4 py-7 pb-16 text-center">
                            <p className="font-bold text-slate-600 text-sm">© {new Date().getFullYear()} 新廊华小生态永续教育小组</p>
                            <p className="text-xs text-slate-500 mt-1">Jawatankuasa Pendidikan Kelestarian SJK (C) Ladang Grisek</p>
                            <p className="mt-3 text-[11px] font-medium text-emerald-700">一起回收 · 一起守护地球 / Bersama mengitar semula untuk bumi</p>
                        </div>
                    </footer>
                    
                    {/* Modals and Overlays */}
                    {notification && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-bold z-[70] animate-pop ${notification.type === 'success' ? 'semantic-success' : 'semantic-danger'}`}>
                            <span>{notification.type === 'success' ? '✓' : '!'}</span>{notification.msg}
                        </div>
                    )}

                    {showDashboardUnlockModal && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[105] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full animate-pop flex flex-col items-center relative">
                                <button onClick={() => {setShowDashboardUnlockModal(false); setDashboardSecurityInput('');}} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 p-2 rounded-full transition-colors"><IconX size={20} /></button>
                                <div className="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-4 text-red-500 shadow-inner"><IconLock size={32} /></div>
                                <h3 className="font-bold text-slate-800 text-lg mb-2">需要高级权限</h3>
                                <p className="text-xs text-slate-500 text-center mb-6">生成数据报表与保存海报需要输入密码。</p>
                                <SecurePasswordInput value={dashboardSecurityInput} onChange={e => setDashboardSecurityInput(e.target.value)} onEnter={handleDashboardUnlock} placeholder="••••" theme="red" autoFocus={true} />
                                <button onClick={handleDashboardUnlock} className="mt-4 w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 transition-transform active:scale-95" disabled={dashboardSecurityInput.length < 8}>解锁执行</button>
                            </div>
                        </div>
                    )}

                    {confirmModal.show && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 animate-pop">
                                <h3 className={`text-xl font-bold mb-2 ${confirmModal.isDestructive ? 'text-red-600' : 'text-slate-800'}`}>{confirmModal.title}</h3>
                                <p className="text-slate-600 mb-6">{confirmModal.msg}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmModal({ ...confirmModal, show: false })} className="px-4 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-100">取消 / Batal</button>
                                    <button onClick={confirmModal.onConfirm} className={`px-4 py-2 rounded-lg font-bold text-white shadow-lg ${confirmModal.isDestructive ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700'}`}>确定 / Ya</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {securityCheck.show && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full animate-pop flex flex-col items-center relative">
                                <button onClick={() => setSecurityCheck({ show: false, callback: null, error: '', verifying: false })} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 p-2 rounded-full transition-colors"><IconX size={20} /></button>
                                <div className="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-4 text-red-500 shadow-inner"><IconLock size={32} /></div>
                                <h3 className="font-bold text-slate-800 text-lg mb-2">需要高级权限</h3>
                                <p className="text-xs text-slate-500 text-center mb-6">执行此操作需要输入二级安全密码。</p>
                                <SecurePasswordInput value={securityInput} onChange={(e) => setSecurityInput(e.target.value)} onEnter={handleSecurityVerify} placeholder="••••" autoFocus={true} theme="red" />
                                <button disabled={securityInput.length < 8} onClick={handleSecurityVerify} className="mt-4 w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 transition-transform active:scale-95">验证并执行</button>
                            </div>
                        </div>
                    )}

                    {deleteRequestModal.show && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[65] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 animate-pop">
                                <h3 className="text-xl font-bold text-slate-800 mb-2">请求删除 / Mohon Padam</h3>
                                <p className="text-sm text-slate-500 mb-4">请输入删除原因 / Masukkan sebab:</p>
                                <input type="text" value={deleteRequestModal.reason} onChange={(e) => setDeleteRequestModal({...deleteRequestModal, reason: e.target.value})} placeholder="Example: Wrong weight" className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" />
                                <div className="flex justify-end gap-3 mt-4">
                                    <button onClick={() => setDeleteRequestModal({ show: false, id: null, reason: '' })} className="px-4 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-100">取消 / Batal</button>
                                    <button onClick={confirmRequestDelete} className="px-4 py-2 rounded-lg font-bold text-white shadow-lg bg-orange-600 hover:bg-orange-700">提交申请 / Mohon</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingStudent && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 animate-pop">
                                <h3 className="text-xl font-bold mb-4 text-slate-800">编辑学生 / Kemaskini</h3>
                                <form onSubmit={handleUpdateStudent} className="space-y-4">
                                    <div><label className="text-xs font-bold text-slate-500">ID (不可更改)</label><input type="text" value={editingStudent.id} disabled className="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 font-mono" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">姓名 / Nama</label><input type="text" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} className="w-full p-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required /></div>
                                    <div><label className="text-xs font-bold text-slate-500">班级 / Kelas</label><select value={editingStudent.className} onChange={e => setEditingStudent({...editingStudent, className: e.target.value})} className="w-full p-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>{CLASS_OPTIONS.map(cls => <option key={cls} value={cls}>{cls}</option>)}</select></div>
                                    <div className="flex gap-2 pt-2"><button type="button" onClick={() => setEditingStudent(null)} className="flex-1 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-100">取消 / Batal</button><button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold shadow-md">保存 / Simpan</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showReportModal && reportData && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-2 sm:p-6 overflow-hidden">
                            {/* Keep a definite viewport-based height so the report area can scroll. */}
                            <div className="bg-slate-100 w-full max-w-5xl h-[calc(100dvh-1rem)] sm:h-[90dvh] min-h-0 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-pop relative">
                                <div className="bg-white p-3 sm:p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b border-slate-200 shadow-sm z-10 shrink-0">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-start gap-2"><IconFileSpreadsheet className="text-emerald-600"/><BilingualLabel primary="月度总结报表生成器" secondary="Penjana Laporan Bulanan" /></h2>
                                    <div className="flex w-full sm:w-auto flex-wrap justify-start sm:justify-end gap-2">
                                        <button onClick={downloadReportPDF} className="order-first bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors shadow-sm"><IconDownload size={14}/> 导出 PDF</button>
                                        <button onClick={downloadReportCSV} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors border border-slate-300"><IconDownload size={14}/> CSV</button>
                                        <button onClick={downloadReportImage} className="bg-white hover:bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors border border-emerald-200"><IconImage size={14}/> 存图</button>
                                        <button onClick={() => setShowReportModal(false)} className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors border border-red-200 ml-2"><IconX size={14}/> 关闭</button>
                                    </div>
                                </div>
                                {/* 修改点2：加上 min-h-0 和 overflow-y-auto，确保 Flex 容器正确滚动 */}
                                <div className="relative flex-1 min-h-0 overflow-auto bg-slate-200 p-3 sm:p-8 flex justify-center items-start custom-scrollbar">
                                    <div className="sm:hidden absolute top-2 left-3 z-20 rounded bg-slate-800/80 px-2 py-1 text-[10px] text-white pointer-events-none">可左右滑动查看完整报表</div>
                                    <MonthlyReportView data={reportData} config={reportConfig} onConfigChange={(newConfig) => { setReportConfig(newConfig); handleGenerateReport(newConfig); }} />
                                </div>
                            </div>
                        </div>
                    )}

                    {showQuarterlyModal && quarterlyData && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-2 sm:p-6 overflow-hidden">
                            {/* Keep a definite viewport-based height so the report area can scroll. */}
                            <div className="bg-slate-100 w-full max-w-5xl h-[calc(100dvh-1rem)] sm:h-[90dvh] min-h-0 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-pop relative">
                                <div className="bg-white p-3 sm:p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b border-slate-200 shadow-sm z-10 shrink-0">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-start gap-2"><IconTrophy className="text-blue-600"/><BilingualLabel primary="季度王者榜生成器" secondary="Penjana Carta Juara Suku Tahun" /></h2>
                                    <div className="flex w-full sm:w-auto flex-wrap justify-start sm:justify-end gap-2">
                                        <button onClick={downloadQuarterlyPDF} className="order-first bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors shadow-sm"><IconDownload size={14}/> 导出 PDF</button>
                                        <button onClick={downloadQuarterlyCSV} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors border border-slate-300"><IconDownload size={14}/> CSV</button>
                                        <button onClick={downloadQuarterlyImage} className="bg-white hover:bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors border border-emerald-200"><IconImage size={14}/> 存图</button>
                                        <button onClick={() => setShowQuarterlyModal(false)} className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors border border-red-200 ml-2"><IconX size={14}/> 关闭</button>
                                    </div>
                                </div>
                                {/* 修改点4：加上 min-h-0 和 overflow-y-auto */}
                                <div className="relative flex-1 min-h-0 overflow-auto bg-slate-200 p-3 sm:p-8 flex justify-center items-start custom-scrollbar">
                                    <div className="sm:hidden absolute top-2 left-3 z-20 rounded bg-slate-800/80 px-2 py-1 text-[10px] text-white pointer-events-none">可左右滑动查看完整报表</div>
                                    <QuarterlyReportView data={quarterlyData} config={quarterlyConfig} onConfigChange={(newConfig) => { setQuarterlyConfig(newConfig); handleGenerateQuarterly(newConfig); }} />
                                </div>
                            </div>
                        </div>
                    )}

                    {showPosterModal && posterData && (
                        <div role="dialog" aria-modal="true" aria-label="Dialog" className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 overflow-hidden">
                            <div className="bg-slate-100 w-full max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-pop max-h-[95vh]">
                                <div className="bg-white p-3 flex justify-between items-center border-b border-slate-200 shadow-sm shrink-0">
                                    <h2 className="font-bold text-slate-800 text-sm">海报预览</h2>
                                    <div className="flex gap-2">
                                        <button onClick={downloadPoster} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow-sm">↓ 保存图片</button>
                                        <button onClick={() => setShowPosterModal(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded text-xs font-bold">关闭</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-auto p-4 flex justify-center bg-slate-200 custom-scrollbar">
                                    <div ref={posterRef} className="bg-white p-6 shadow-xl relative overflow-hidden" style={{ width: '400px', minHeight: '600px' }}>
                                        {/* Poster Content */}
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-100 rounded-full blur-3xl opacity-50 -mr-10 -mt-10"></div>
                                        <div className="absolute bottom-0 left-0 w-40 h-40 bg-blue-100 rounded-full blur-3xl opacity-50 -ml-10 -mb-10"></div>
                                        
                                        <div className="relative z-10 text-center mb-6">
                                            <div className="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center text-3xl mx-auto mb-2 shadow-inner ring-4 ring-white">♻️</div>
                                            <h1 className="text-xl font-black text-slate-800">SJK (C) Ladang Grisek</h1>
                                            <h2 className="text-lg font-bold text-emerald-600 tracking-widest mt-1">环保回收荣誉榜</h2>
                                            <p className="text-xs font-bold text-slate-400 mt-2 bg-slate-100 inline-block px-3 py-1 rounded-full">{posterData.date}</p>
                                        </div>

                                        <div className="relative z-10 bg-slate-900 text-white rounded-xl p-4 text-center mb-6 shadow-lg border border-slate-800">
                                            <p className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mb-1">全校总回收量</p>
                                            <div className="text-3xl font-black">{posterData.total} <span className="text-sm font-medium opacity-80">KG</span></div>
                                            <div className="text-[10px] text-slate-400 mt-1">感谢每一位同学的付出！</div>
                                        </div>

                                        <div className="relative z-10 space-y-6">
                                            {posterType === 'class' ? (
                                                <React.Fragment>
                                                    <div className="bg-emerald-50/50 rounded-xl p-4 border border-emerald-100">
                                                        <h3 className="font-bold text-emerald-800 text-sm mb-3 flex items-center gap-2 border-b border-emerald-200 pb-2"><IconCrown size={16}/> 低年级组 TOP 3</h3>
                                                        <div className="space-y-3">
                                                            {posterData.lower.map((c, i) => (
                                                                <div key={i} className="flex justify-between items-center">
                                                                    <div className="flex items-center gap-2 font-bold text-slate-700 text-sm"><span className="text-lg">{i===0?'🥇':i===1?'🥈':'🥉'}</span> {c.className}</div>
                                                                    <div className="font-mono font-bold text-emerald-600">{c.totalWeight.toFixed(2)}kg</div>
                                                                </div>
                                                            ))}
                                                            {posterData.lower.length===0 && <div className="text-xs text-slate-400 text-center py-2">暂无数据</div>}
                                                        </div>
                                                    </div>
                                                    <div className="bg-blue-50/50 rounded-xl p-4 border border-blue-100">
                                                        <h3 className="font-bold text-blue-800 text-sm mb-3 flex items-center gap-2 border-b border-blue-200 pb-2"><IconCrown size={16}/> 高年级组 TOP 3</h3>
                                                        <div className="space-y-3">
                                                            {posterData.upper.map((c, i) => (
                                                                <div key={i} className="flex justify-between items-center">
                                                                    <div className="flex items-center gap-2 font-bold text-slate-700 text-sm"><span className="text-lg">{i===0?'🥇':i===1?'🥈':'🥉'}</span> {c.className}</div>
                                                                    <div className="font-mono font-bold text-blue-600">{c.totalWeight.toFixed(2)}kg</div>
                                                                </div>
                                                            ))}
                                                            {posterData.upper.length===0 && <div className="text-xs text-slate-400 text-center py-2">暂无数据</div>}
                                                        </div>
                                                    </div>
                                                </React.Fragment>
                                            ) : (
                                                <div className="bg-amber-50/50 rounded-xl p-4 border border-amber-100">
                                                    <h3 className="font-bold text-amber-800 text-sm mb-3 flex items-center gap-2 border-b border-amber-200 pb-2"><IconTrophy size={16}/> {posterType === 'individual_lower' ? '低年级' : '高年级'} 个人王者榜</h3>
                                                    <div className="space-y-2">
                                                        {posterData.topList.slice(0, 10).map((s, i) => (
                                                            <div key={i} className="flex justify-between items-center text-sm border-b border-amber-100/50 pb-1 last:border-0 last:pb-0">
                                                                <div className="flex items-center gap-2 overflow-hidden">
                                                                    <span className="font-bold text-amber-600 w-4">{i+1}.</span>
                                                                    <span className="font-bold text-slate-700 truncate max-w-[120px]">{s.name.replace(/[\u4e00-\u9fa5]+/g, '').replace(/[()]/g, '').trim() || s.name}</span>
                                                                    <span className="text-[10px] bg-white px-1.5 py-0.5 rounded text-slate-500 border border-slate-200">{s.className}</span>
                                                                </div>
                                                                <div className="font-mono font-bold text-amber-700 shrink-0">{s.totalWeight.toFixed(1)}kg</div>
                                                            </div>
                                                        ))}
                                                        {posterData.topList.length===0 && <div className="text-xs text-slate-400 text-center py-2">暂无数据</div>}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="mt-8 text-center text-[10px] text-slate-400 border-t border-slate-100 pt-4">
                                            Generasi Hijau, Tanggungjawab Bersama<br/>
                                            <span className="font-mono mt-1 block">Powered by SJKC LG System</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </ErrorBoundary>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
